<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="it9CKE-uNcLEpMajMQhtT2D9swjrAmn8Gkj-4fomiFs" />
    <title>HS Results - AI Powered Consultancy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              hs: {
                blue: '#1a2b4b', // Deep Navy
                accent: '#0ea5e9', // AI Sky Blue
                orange: '#f97316', // Corporate Orange
                grey: '#777777', // Footer Grey
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'marquee': 'marquee 40s linear infinite',
            },
            keyframes: {
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' },
              },
              fadeIn: {
                'from': { opacity: '0', transform: 'translateY(10px)' },
                'to': { opacity: '1', transform: 'translateY(0)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' }
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #ffffff;
      }
      .gradient-text {
        background: linear-gradient(to right, #1a2b4b, #0ea5e9);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      @media print {
        .no-print { display: none !important; }
      }
      .marquee-container {
        overflow: hidden;
        white-space: nowrap;
        position: relative;
      }
      .marquee-content {
        display: inline-flex;
      }
    </style>
  <script type="importmap">
{
  "imports": {

    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",

  }
}
</script>
